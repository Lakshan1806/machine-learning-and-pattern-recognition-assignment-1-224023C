services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ./data:/input:ro
      - training-cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  training-cache:
